name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter build linux --release
      - run: tar -C build/linux/x64/release/bundle -czf cloudrelaef-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with: {name: linux, path: cloudrelaef-linux-x64.tar.gz}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cloudrelaef-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: cloudrelaef-windows-x64.zip}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter build macos --release
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/cloudrelaef.app cloudrelaef-macos.zip
      - uses: actions/upload-artifact@v4
        with: {name: macos, path: cloudrelaef-macos.zip}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk cloudrelaef-android.apk
      - uses: actions/upload-artifact@v4
        with: {name: android, path: cloudrelaef-android.apk}

  publish:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
